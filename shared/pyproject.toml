[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-shared"
version = "0.1.0"
description = "Shared code for the creative-tester Lambdas"
requires-python = ">=3.12"
# boto3 is provided by the Lambda runtime; listed here for local dev/tests only.
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto>=5"]

[tool.setuptools.packages.find]
where = ["src"]
